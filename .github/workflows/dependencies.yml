name: Python dependency audit

on:
  push:
    paths:
      - requirements.txt
      - requirements.lock
      - verify_dependencies.py
      - .github/workflows/dependencies.yml
  pull_request:
    paths:
      - requirements.txt
      - requirements.lock
      - verify_dependencies.py
      - .github/workflows/dependencies.yml

jobs:
  dependency-audit:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up supported Python baseline
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependency verification tools
        shell: pwsh
        run: python -m pip install --disable-pip-version-check uv pip-audit pip-licenses

      - name: Verify lock freshness, hashes, and advisories
        shell: pwsh
        run: python verify_dependencies.py --check --validate --audit

      - name: Install the locked application environment
        shell: pwsh
        run: uv pip install --system --require-hashes -r requirements.lock

      - name: Generate dependency license report
        shell: pwsh
        run: pip-licenses --format=csv --with-urls --output-file "$env:RUNNER_TEMP\fileorganizer-dependency-licenses.csv"

      - name: Upload dependency license report
        uses: actions/upload-artifact@v4
        with:
          name: fileorganizer-dependency-licenses
          path: "${{ runner.temp }}/fileorganizer-dependency-licenses.csv"
